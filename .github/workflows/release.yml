# Builds the Windows installer and portable zip and publishes them to GitHub Releases, fully online.
# Trigger: push a tag like v2.5.2, or run this workflow manually with a version.
#
# The Windows binaries are unsigned (this fork ships without Authenticode). The release's SHA256SUMS is signed
# with the fork update key from the FILEE_UPDATE_KEY repository secret, and the .sig is uploaded next to it:
# the in-app updater (FileeRepositoryUrl points at this fork) checks it with FileeUpdatePublicKey.
#
# To also build the Linux and macOS packages, restore the "portable" job (uses ./.github/workflows/portable.yml)
# and upload its artifacts too.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 2.5.2 (a matching v<version> tag is created)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = '${{ github.ref_name }}' }
          $version = $version.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Fonts
        shell: pwsh
        run: ./build/fetch-fonts.ps1

      - name: Restore Zig toolchain
        uses: actions/cache/restore@v5
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      # Windows 11 top-level Explorer menu: FileeExplorerMenu.dll (C, built with a pinned Zig toolchain) and the
      # unsigned sparse package FileeExplorerMenu.msix. Built before the tests so they check the real files.
      - name: Build Explorer menu extension
        shell: pwsh
        run: ./build/build-explorer-menu.ps1 -Version ${{ steps.version.outputs.value }}

      # Same engines as CI, so the release runs the same tests (they are not part of the installer).
      - name: Fetch rhwp, Pandoc and 7-Zip for engine tests
        shell: pwsh
        run: ./build/fetch-engines.ps1 -Only rhwp,pandoc,7zip

      - name: Build
        run: dotnet build Filee.slnx -c Release

      - name: Test UI on its own
        run: dotnet test tests/Filee.App.Tests --no-build -c Release --blame-crash --blame-hang-timeout 5m --logger "console;verbosity=normal" --results-directory TestResults/app

      - name: Test
        run: dotnet test Filee.slnx --no-build -c Release --filter "FullyQualifiedName!~Filee.App.Tests"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/
          if-no-files-found: ignore

      # Publishes the app (Release, self-contained, ReadyToRun) with the Explorer menu extension and the bundled rhwp
      # and 7-Zip and the Microsoft C++ runtime, publishes Setup (one self-contained file), appends the app to it as a
      # checked payload and zips the portable copy.
      - name: Build installer and portable zip
        shell: pwsh
        run: ./build/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -Portable

      # Signs every Filee-<version>-SHA256SUMS.txt with the fork update key. The key never reaches the logs.
      - name: Sign SHA256SUMS with the fork update key
        shell: pwsh
        env:
          FILEE_UPDATE_KEY: ${{ secrets.FILEE_UPDATE_KEY }}
        run: |
          if (-not $env:FILEE_UPDATE_KEY) { throw 'FILEE_UPDATE_KEY is not set in the repository secrets.' }
          $key = Join-Path $env:RUNNER_TEMP 'filee-update.pem'
          [IO.File]::WriteAllText($key, $env:FILEE_UPDATE_KEY, [Text.Encoding]::ASCII)
          try {
            $publicKey = (Select-Xml -Path Directory.Build.props -XPath '//FileeUpdatePublicKey').Node.InnerText.Trim()
            ./build/sign-checksums.ps1 -Folder Releases -PrivateKeyPath $key -PublicKey $publicKey
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $tag = "v$version"
          $notes = "## Filee $version / 网页切片`n`n**中文**`n- 自动构建的 Windows 安装包与便携版；更新用本 fork 的更新密钥签名。`n- 网页切片：用真实浏览器渲染整页，按 2.35:1、16:9、9:16、4:3、3:4、1:1 切成多张 PNG，末块补白。`n`n**English**`n- Windows installer and portable build, built automatically; updates are signed with this fork's update key.`n- Web page slices: render the full page with a real browser and cut it into PNG tiles at 2.35:1, 16:9, 9:16, 4:3, 3:4 or 1:1, padding the last tile."
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $notesFile $notes -Encoding utf8
          $files = Get-ChildItem Releases -File -Filter "Filee-$version-*" | ForEach-Object FullName
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag --repo $env:GITHUB_REPOSITORY @files --clobber
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Filee $version" --notes-file $notesFile --draft=false
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target main --title "Filee $version" --notes-file $notesFile --latest @files
          }
